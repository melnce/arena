[package]
name = "arena-py"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "arena"
crate-type = ["cdylib"]
doctest = false
test = false

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
arena-engine = { path = "../engine" }
pyo3 = { version = "0.23", features = ["abi3-py310"] }
rayon = "1"
serde_json = "1"
