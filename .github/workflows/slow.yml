name: slow

on:
  # 07:00 UTC = midnight Pacific. Owner activity on this repo clusters
  # 16:00–01:30 UTC; this is after that window and before weekday EU/US morning.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
  push:
    branches: [main]

# Queue, do not kill. workflow_dispatch / schedule keep their own
# group so a manual rerun does not share a slot with a nightly, and
# a nightly does not share a slot with a dispatch the owner just
# started. cancel-in-progress was true for push in #53, which killed
# a running merge-to-main job when a second merge landed — and
# `if: failure()` does not run on cancel, so a hang that hits
# timeout-minutes (also a cancel) opened no issue. With this false,
# cancelled() means timeout or a human cancel, never a superseded
# in-progress push, so the opener can use failure() || cancelled().
# A superseded *pending* run is still dropped; a running one finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

# Least privilege. contents:read is enough for checkout on a public
# repo; issues:write is the only extra the tracking-issue steps need.
# Cache uses the runner's ACTIONS_RUNTIME_TOKEN, not this grant.
permissions:
  contents: read
  issues: write

jobs:
  # One suite per job (fail-fast: false). Sequential main runs timed out
  # at 65 min (run 36240655622). Parallel gate on this branch (run
  # 36266480089, wall ~22 min): h0_explain 1m50s, h0_fusemacro 6m7s,
  # h0_tt 19m15s, h0_alloc 21m42s, h0_olethal 5m52s, h0_opp 8m53s,
  # h0_wv 5m45s, net 2m19s, record 1m53s, h0_defaults 3m41s, h0_info
  # 4m17s, h0_lcap_clip 3m0s, h0_oevo 5m25s, h0_pess 4m21s. Each job
  # timeout is chosen so measured CI time stays under ~two-thirds of
  # timeout-minutes (plus setup/cache).
  suite:
    name: slow (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: h0_explain
            test: h0_explain
            filter: bench_nodes_unchanged_without_sink
            ignored: false
            timeout: 15
          - suite: h0_fusemacro
            test: h0_fusemacro
            filter: ""
            ignored: true
            timeout: 25
          - suite: h0_tt
            test: h0_tt
            filter: ""
            ignored: true
            timeout: 45
          - suite: h0_alloc
            test: h0_alloc
            filter: ""
            ignored: true
            timeout: 40
          - suite: h0_olethal
            test: h0_olethal
            filter: ""
            ignored: true
            timeout: 20
          - suite: h0_opp
            test: h0_opp
            filter: ""
            ignored: true
            timeout: 25
          - suite: h0_wv
            test: h0_wv
            filter: ""
            ignored: true
            timeout: 20
          - suite: net
            test: net
            filter: ""
            ignored: true
            timeout: 15
          - suite: record
            test: record
            filter: ""
            ignored: true
            timeout: 15
          - suite: h0_defaults
            test: h0_defaults
            filter: ""
            ignored: true
            timeout: 20
          - suite: encode_v2
            test: encode_v2
            filter: ""
            ignored: false
            timeout: 15
          - suite: h0_info
            test: h0_info
            filter: ""
            ignored: true
            timeout: 25
          - suite: h0_lcap_clip
            test: h0_lcap_clip
            filter: ""
            ignored: true
            timeout: 20
          - suite: h0_oevo
            test: h0_oevo
            filter: ""
            ignored: true
            timeout: 25
          - suite: h0_pess
            test: h0_pess
            filter: ""
            ignored: true
            timeout: 25
          - suite: h0_horizon
            test: h0_horizon
            filter: ""
            ignored: true
            timeout: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run suite (release)
        run: |
          set -euo pipefail
          if [ "${{ matrix.ignored }}" = "true" ]; then
            cargo test --release --test ${{ matrix.test }} -- --include-ignored --nocapture
          elif [ -n "${{ matrix.filter }}" ]; then
            cargo test --release --test ${{ matrix.test }} ${{ matrix.filter }} -- --nocapture
          else
            cargo test --release --test ${{ matrix.test }} -- --nocapture
          fi

  # One open issue <=> the slow suite is currently red. Keyed on the
  # exact title "slow suite is red" (unique, survives a label edit).
  # The `slow-suite` label is the lookup index so we do not wait on
  # GitHub search, which can lag a just-created issue.
  # Issue open/close runs only on main; other refs just report.
  track:
    name: slow (track)
    needs: suite
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Report slow suite status
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          ON_MAIN: ${{ github.ref == 'refs/heads/main' }}
          SUITE_RESULT: ${{ needs.suite.result }}
        run: |
          set -euo pipefail

          # Per-suite timeout-minutes (must match the suite matrix above).
          TIMEOUTS='{
            "h0_explain": 15,
            "h0_fusemacro": 25,
            "h0_tt": 45,
            "h0_alloc": 40,
            "h0_olethal": 20,
            "h0_opp": 25,
            "h0_wv": 20,
            "net": 15,
            "record": 15,
            "h0_defaults": 20,
            "encode_v2": 15,
            "h0_info": 25,
            "h0_lcap_clip": 20,
            "h0_oevo": 25,
            "h0_pess": 25
          }'

          failed_jobs=""
          timed_out_jobs=""
          cancelled_jobs=""
          jobs_json=""
          if jobs_json="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs")"; then
            while IFS= read -r job; do
              name="$(printf '%s' "${job}" | jq -r '.name')"
              conclusion="$(printf '%s' "${job}" | jq -r '.conclusion // empty')"
              started_at="$(printf '%s' "${job}" | jq -r '.started_at // empty')"
              suite="${name#slow (}"
              suite="${suite%)}"
              timeout_minutes="$(printf '%s' "${TIMEOUTS}" | jq -r --arg s "${suite}" '.[$s] // empty')"
              if [ "${conclusion}" = "failure" ]; then
                failed_jobs="${failed_jobs}${name}; "
              elif [ "${conclusion}" = "timed_out" ]; then
                timed_out_jobs="${timed_out_jobs}${name} (timeout-minutes: ${timeout_minutes}); "
              elif [ "${conclusion}" = "cancelled" ]; then
                timed_out=false
                if [ -n "${started_at}" ] && [ -n "${timeout_minutes}" ]; then
                  elapsed=$(( $(date +%s) - $(date -d "${started_at}" +%s) ))
                  if [ "${elapsed}" -ge $((timeout_minutes * 60 - 30)) ]; then
                    timed_out=true
                  fi
                fi
                if [ "${timed_out}" = "true" ]; then
                  timed_out_jobs="${timed_out_jobs}${name} (timeout-minutes: ${timeout_minutes}); "
                else
                  cancelled_jobs="${cancelled_jobs}${name}; "
                fi
              fi
            done < <(printf '%s' "${jobs_json}" | jq -c '.jobs[] | select(.name != "slow (track)" and (.name | startswith("slow (")))')
          fi

          failed_jobs="${failed_jobs%; }"
          timed_out_jobs="${timed_out_jobs%; }"
          cancelled_jobs="${cancelled_jobs%; }"

          if [ -n "${failed_jobs}" ]; then
            headline="Failed job(s): **${failed_jobs}**"
          elif [ -n "${timed_out_jobs}" ]; then
            headline="Timed out job(s): **${timed_out_jobs}**"
          elif [ -n "${cancelled_jobs}" ]; then
            headline="Cancelled job(s): **${cancelled_jobs}**"
          elif [ "${SUITE_RESULT}" = "success" ]; then
            headline="All slow suite jobs passed."
          else
            headline="Slow suite result: **${SUITE_RESULT}**"
          fi

          printf '%s\n\nRun: %s\n\nEvent: `%s` on `%s` (`%s`).\nMatrix result: `%s`.\n' \
            "${headline}" "${RUN_URL}" "${EVENT_NAME}" "${REF_NAME}" "${SHA}" "${SUITE_RESULT}"

          if [ "${ON_MAIN}" != "true" ]; then
            printf '\nSkipping slow-suite issue tracking (not main).\n'
          fi

      - name: Open or update slow-suite tracking issue
        if: ${{ github.ref == 'refs/heads/main' && needs.suite.result != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: slow suite is red
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          gh label create slow-suite \
            --description "The nightly slow workflow is currently failing" \
            --color B60205 \
            --force

          TIMEOUTS='{
            "h0_explain": 15,
            "h0_fusemacro": 25,
            "h0_tt": 45,
            "h0_alloc": 40,
            "h0_olethal": 20,
            "h0_opp": 25,
            "h0_wv": 20,
            "net": 15,
            "record": 15,
            "h0_defaults": 20,
            "encode_v2": 15,
            "h0_info": 25,
            "h0_lcap_clip": 20,
            "h0_oevo": 25,
            "h0_pess": 25
          }'

          failed_jobs=""
          timed_out_jobs=""
          cancelled_jobs=""
          if jobs_json="$(curl -fsS \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs")"; then
            while IFS= read -r job; do
              name="$(printf '%s' "${job}" | jq -r '.name')"
              conclusion="$(printf '%s' "${job}" | jq -r '.conclusion // empty')"
              started_at="$(printf '%s' "${job}" | jq -r '.started_at // empty')"
              suite="${name#slow (}"
              suite="${suite%)}"
              timeout_minutes="$(printf '%s' "${TIMEOUTS}" | jq -r --arg s "${suite}" '.[$s] // empty')"
              if [ "${conclusion}" = "failure" ]; then
                failed_jobs="${failed_jobs}${name}; "
              elif [ "${conclusion}" = "timed_out" ]; then
                timed_out_jobs="${timed_out_jobs}${name} (timeout-minutes: ${timeout_minutes}); "
              elif [ "${conclusion}" = "cancelled" ]; then
                timed_out=false
                if [ -n "${started_at}" ] && [ -n "${timeout_minutes}" ]; then
                  elapsed=$(( $(date +%s) - $(date -d "${started_at}" +%s) ))
                  if [ "${elapsed}" -ge $((timeout_minutes * 60 - 30)) ]; then
                    timed_out=true
                  fi
                fi
                if [ "${timed_out}" = "true" ]; then
                  timed_out_jobs="${timed_out_jobs}${name} (timeout-minutes: ${timeout_minutes}); "
                else
                  cancelled_jobs="${cancelled_jobs}${name}; "
                fi
              fi
            done < <(printf '%s' "${jobs_json}" | jq -c '.jobs[] | select(.name != "slow (track)" and (.name | startswith("slow (")))')
          fi

          failed_jobs="${failed_jobs%; }"
          timed_out_jobs="${timed_out_jobs%; }"
          cancelled_jobs="${cancelled_jobs%; }"

          if [ -n "${failed_jobs}" ]; then
            headline="Failed job(s): **${failed_jobs}**"
          elif [ -n "${timed_out_jobs}" ]; then
            headline="Timed out job(s): **${timed_out_jobs}**"
          elif [ -n "${cancelled_jobs}" ]; then
            headline="Cancelled job(s): **${cancelled_jobs}**"
          else
            headline="Slow suite result: **${{ needs.suite.result }}**"
          fi

          body="$(printf '%s\n\nRun: %s\n\nEvent: `%s` on `%s` (`%s`).\n' \
            "${headline}" "${RUN_URL}" "${EVENT_NAME}" "${REF_NAME}" "${SHA}")"

          existing="$(
            gh issue list --state all --label slow-suite --limit 50 \
              --json number,title,state \
              --jq '[.[] | select(.title == env.ISSUE_TITLE)] | first | .number // empty'
          )"

          if [ -n "${existing}" ]; then
            gh issue comment "${existing}" --body "${body}"
            state="$(gh issue view "${existing}" --json state --jq .state)"
            if [ "${state}" = "CLOSED" ]; then
              gh issue reopen "${existing}"
            fi
          else
            gh issue create --title "${ISSUE_TITLE}" --label slow-suite --body "${body}"
          fi

      - name: Close slow-suite tracking issue
        if: ${{ github.ref == 'refs/heads/main' && needs.suite.result == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ISSUE_TITLE: slow suite is red
        run: |
          set -euo pipefail

          existing="$(
            gh issue list --state open --label slow-suite --limit 50 \
              --json number,title,state \
              --jq '[.[] | select(.title == env.ISSUE_TITLE)] | first | .number // empty'
          )"
          if [ -z "${existing}" ]; then
            echo "No open tracking issue; slow suite is already green."
            exit 0
          fi

          body="$(printf 'slow suite is green again.\n\nRun: %s\n' "${RUN_URL}")"
          gh issue comment "${existing}" --body "${body}"
          gh issue close "${existing}" --reason completed
