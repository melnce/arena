name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: engine crate has no web/wasm deps
        run: |
          set -e
          tree=$(cargo tree -p arena-engine -e normal)
          if echo "$tree" | grep -E 'web-sys|js-sys|wasm-bindgen'; then
            echo "arena-engine must not depend on web-sys, js-sys, or wasm-bindgen"
            exit 1
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: validate cards
        working-directory: tools
        run: npm ci && node validate.mjs
