name: ci

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: soak 100 games
        # Fixture-deck soak (`soak.rs`) and the class-matrix random-deck gate
        # (`soak_random.rs`) share ARENA_SOAK_GAMES. Default N is 0 / 20;
        # CI uses 100 for both.
        run: ARENA_SOAK_GAMES=100 cargo test --release soak -- --nocapture

      - name: throughput floor
        # Three benches in one binary; run them one at a time so they do not
        # share a CI core and miss the 800 games/s floor.
        run: ARENA_BENCH_MIN_GAMES_PER_SEC=800 cargo test --release --test throughput -- --nocapture --test-threads=1

      - name: oracle traces
        run: cargo test --release --test oracle -- --nocapture

      - name: engine crate has no web/wasm deps
        run: |
          set -e
          tree=$(cargo tree -p arena-engine -e normal)
          if echo "$tree" | grep -E 'web-sys|js-sys|wasm-bindgen'; then
            echo "arena-engine must not depend on web-sys, js-sys, or wasm-bindgen"
            exit 1
          fi

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: schema generator matches committed JSON
        run: python3 tools/gen_schema.py && git diff --exit-code schema/cards.schema.json

      - name: validate cards
        working-directory: tools
        run: npm ci && node validate.mjs && node validate-glossary.mjs && node corruption-proofs.mjs

      - name: coverage verb walk
        run: python3 tools/coverage-check.py

      - name: phrase index — no unlisted divergence
        run: python3 tools/phrase_index.py --check-divergences

      - name: phrase index — doc current
        run: python3 tools/phrase_index.py --check-doc

  wasm:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-wasm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - name: wasm-pack
        run: |
          if ! command -v wasm-pack >/dev/null; then
            curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
          fi

      - name: wasm-pack web
        run: wasm-pack build wasm --target web --release --out-dir ../ui/dev/pkg

      - name: wasm-pack nodejs
        run: wasm-pack build wasm --target nodejs --release --out-dir pkg-node

      - name: native traces
        run: |
          cargo build -p arena-engine --release --bin arena-trace
          mkdir -p target/wasm-traces
          ./target/release/arena-trace \
            --seed 1 --games 20 \
            --deck-a oracle/decks/basic-forest.json \
            --deck-b oracle/decks/basic-rune.json \
            --out target/wasm-traces \
            --first coin

      - name: node wasm == native
        env:
          ARENA_WASM_PKG: wasm/pkg-node
          ARENA_TRACE_DIR: target/wasm-traces
          ARENA_DECK_A: oracle/decks/basic-forest.json
          ARENA_DECK_B: oracle/decks/basic-rune.json
          ARENA_WASM_SEEDS: "20"
          ARENA_FIRST: coin
        run: node wasm/tests/node.test.mjs
